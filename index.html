<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEP - API</title>
    <link href="cep-api.css" rel="stylesheet">
    <!--Awesome Icon-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <!--Search Field-->
    <section class="search">
        <form action="" method="POST" id="form" class="form">
                <h3>CEP - API</h3>

                <div class="form__group">
                    <div class="form__label">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <label for="cep">Buscar CEP</label>
                    </div>

                    <div class="form__message">
                        <p class="form__label__para">Digite o CEP com traço (ex: 12345-678)</p>
                    </div>

                    <div class="form__input">
                        <input type="text" name="cep" id="cep" title="Digite o CEP com traço (ex: 12345-678)" placeholder="Ex: 12345-678">
                    </div>
                </div>

                <div class="form__button">
                    <input type="submit" name="submit" id="submit" value="Consultar CEP">
                </div>            
        </form>
    </section>

    <!--Modal-->
    <section class="modal">
        <div class="modal__close">
            <i class="fa-solid fa-x"></i>
        </div>

        <article class="modal__top flex-item">
            <span class="modal__top__icon">
                <i class="fa-solid fa-location-dot"></i>
            </span>

            <h2 class="modal__top__cep"></h2>
        </article>
            
        <article class="modal__middle">
            <div class="modal__middle__district">
                <h3 class="modal__middle__district--title">Bairro</h3>

                <div class="modal__middle__district--sup flex-item">
                    <span class="modal__middle__district--icon">
                        <i class="fa-solid fa-location-arrow"></i>
                    </span>

                    <h3 class="modal__middle__district--info"></h3>
                </div>
            </div>
                
            <div class="modal__middle__state">
                <h3 class="middle__state__title">Cidade - Estado</h3>

                <div class="modal__middle__state--sup flex-item">
                    <span class="modal__middle__state--icon">
                        <i class="fa-solid fa-compass"></i>
                    </span>

                    <h3 class="modal__middle__state--info"></h3>
                </div>

            <div class="modal__middle__street">
                <h3 class="modal__middle__street--title">Logradouro</h3>

                <div class="modal__middle__street--sup flex-item">
                    <span class="modal__middle__street--icon">
                        <i class="fa-solid fa-road"></i>
                    </span>

                    <h3 class="modal__middle__street--info"></h3>
                </div>
            </div>
        </article>

        <article class="modal__footer">
            <div class="modal__fotter__title--sup flex-item">
                <span class="modal__footer__icon">
                    <i class="fa-solid fa-less-than"></i>
                    <i class="fa-solid fa-greater-than"></i>
                </span>

                <h3 class="modal__footer__title">Endereço Completo</h3>
            </div>
            
            <div class="modal__footer__info"></div>
        </article>
    </section>

    <!--JS-->
    <script src="cep-api.js"></script>
</body>
</html>
